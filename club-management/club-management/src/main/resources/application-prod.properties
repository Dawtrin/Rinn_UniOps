# Production Profile
spring.application.name=club-management-prod

# Database (Docker DB network link)
spring.datasource.url=jdbc:mysql://db:3306/club_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=password123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator Configuration (Strict)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Swagger / OpenAPI (Keep enabled but could be disabled in real prod if desired)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
